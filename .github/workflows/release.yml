name: Build & Release APK

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

# One queue for all branches: every push is merged into main in order, none is skipped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every change is merged into main automatically, and the release is always built from
      # main – so each release contains all changes ever made.
      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads origin main > /dev/null; then
            git fetch origin main
            git checkout -B main origin/main
            if [ "$BRANCH" != "main" ]; then
              git merge --no-edit "origin/$BRANCH"
            fi
          else
            git checkout -B main
          fi
          git push origin main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Build APKs (signed with the Android debug key)
        run: ./gradlew --no-daemon assembleRelease assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Rename APKs
        id: apk
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Lumen-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "Lumen-v${VERSION}-debug.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=Lumen-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "debugfile=Lumen-v${VERSION}-debug.apk" >> "$GITHUB_OUTPUT"
          sha256sum Lumen-v*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Lumen-v${{ steps.apk.outputs.version }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.debugfile }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Lumen ${{ steps.apk.outputs.version }}
          target_commitish: ${{ env.RELEASE_SHA }}
          make_latest: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.debugfile }}
          body: |
            **Lumen Photos ${{ steps.apk.outputs.version }}** – Offline-Galerie für das Pixel 10 Pro, ohne Google-Dienste.

            - Material 3 Expressive Design mit dynamischen Farben und Shared-Element-Animationen
            - Speicher optimieren: ganze Galerie auf Full HD skalieren, Qualitätsstufen mit Vorher/Nachher-Vorschau, Ultra HDR & EXIF bleiben erhalten
            - KI-Suche komplett offline (MobileCLIP / SigLIP 2, 6 Stufen von „Blitz“ bis „Maximum“)
            - Duplikate & ähnliche Serien, Erinnerungen, Editor, Video-Player, Papierkorb

            **Dateien** (beide mit dem Android-Debug-Key signiert, lassen sich übereinander installieren):
            - `Lumen-v${{ steps.apk.outputs.version }}.apk` – optimierter Build (R8), empfohlen
            - `Lumen-v${{ steps.apk.outputs.version }}-debug.apk` – Debug-Build (debuggable, langsamer)

            Installation: APK auf dem Pixel öffnen und „Unbekannte Apps installieren“ erlauben.
            Build aus `main` @ ${{ env.RELEASE_SHA }} – enthält alle bisherigen Änderungen.
